name: Release

# Builds the linux-x86_64 release tarball (web UI embedded) on Ubuntu 22.04, so the binary runs
# on Debian 12 and Ubuntu 22.04+ hosts. Tags v* publish a GitHub release; manual runs keep the
# tarball as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build release tarball
        run: scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hone-quant-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes --title "hone-quant $GITHUB_REF_NAME"
